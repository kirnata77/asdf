name: Check

# 모든 push/PR에서 완료 기준(DoD) 게이트를 돌린다. 로컬의
# `python tools/check.py`와 같은 명령이다(커버리지 하한 포함). check 잡은 kivy를 설치하지 않는다 -
# tests/는 gameflow 이하 헤드리스 로직만 검사한다. 화면은 아래 ui-smoke 잡이 따로 돌려 본다.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          # buildozer 빌드(build-apk.yml)와 같은 버전
          python-version: '3.11'

      - name: Install tools
        run: pip install pytest pytest-cov ruff==0.16.9  # ruff 버전 고정: 서식 결과가 버전마다 다르다

      - name: DoD gate
        run: python tools/check.py

  # 화면(kivy) 스모크 - 실제 앱을 Xvfb에서 띄워 주요 화면을 돌려 본다(tools/ui_smoke.py).
  # 실패하면 PR을 막는다(2026-10-06 연속 초록 확인 뒤 continue-on-error를 지웠다). 스크린샷은 아티팩트로 남는다.
  ui-smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install kivy and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libmtdev1
          pip install kivy pytest  # kivy.tests.common(스크롤 확인 단계)이 pytest를 import한다

      - name: UI smoke
        run: xvfb-run -a -s "-screen 0 1080x2340x24" python tools/ui_smoke.py ui_smoke_shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-shots
          path: ui_smoke_shots
          if-no-files-found: ignore
