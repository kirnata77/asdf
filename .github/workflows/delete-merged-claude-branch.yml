name: Delete merged claude branch

# PR이 병합되면 head 브랜치가 `claude/*`일 때만 원격 브랜치를 지운다.
# 저장소 설정의 "Automatically delete head branches"는 이름으로 거를 수 없어 쓰지 않는다.
# 병합 없이 닫힌 PR, 다른 이름의 브랜치, 포크에서 온 PR은 건드리지 않는다.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # 이미 지워졌으면(수동 삭제 등) 실패로 치지 않는다.
          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"; then
            echo "deleted ${BRANCH}"
          elif gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "::error::failed to delete ${BRANCH}"
            exit 1
          else
            echo "${BRANCH} already gone"
          fi
