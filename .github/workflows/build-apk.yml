name: Build APK

# v* 태그를 push할 때만 돈다(큰 기능을 끝내면 사용자가 v<buildozer.spec의 version> 태그를 push한다).
# 게임 코드 push/PR이나 이 파일의 변경으로는 돌지 않는다.
on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the tag matches buildozer.spec version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          spec_version=$(sed -n 's/^version *= *//p' buildozer.spec | head -n 1 | tr -d '[:space:]')
          if [ -z "$spec_version" ] || [ "$TAG" != "v${spec_version}" ]; then
            echo "::error::tag ${TAG} does not match buildozer.spec version '${spec_version}' (expected v${spec_version})"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: Cache buildozer downloads (Android SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: |
          # yes가 라이선스 질문에 자동으로 답한다. 빌드가 끝나 yes가 SIGPIPE로
          # 끝나는 것을 실패로 보지 않도록 pipefail을 끈다.
          set +o pipefail
          yes | buildozer -v android debug
          ls -l bin/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnfmobile-apk
          path: bin/*.apk

      - name: Publish APK to the release of this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 같은 태그를 다시 돌리면 릴리스가 이미 있으므로 APK만 덮어쓴다.
          gh release create "$TAG" bin/*.apk --verify-tag --title "$TAG (debug APK)" --notes "태그 $TAG ($GITHUB_SHA)에서 빌드한 디버그 APK" \
            || gh release upload "$TAG" bin/*.apk --clobber
