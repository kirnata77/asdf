name: Delete merged branch

# PR이 병합되면 head 브랜치(원격)를 지운다 - 병합된 브랜치는 끝난 것이다(CLAUDE.md "Git").
# 기본 브랜치(main)가 head인 PR, 병합 없이 닫힌 PR, 포크에서 온 PR은 건드리지 않는다.
# 저장소 설정의 "Automatically delete head branches"와 같은 일이지만, 설정은 저장소 밖에
# 있어 보이지 않으므로 워크플로로 둔다.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref != github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # 이미 지워졌으면(수동 삭제 등) 실패로 치지 않는다.
          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"; then
            echo "deleted ${BRANCH}"
          elif gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "::error::failed to delete ${BRANCH}"
            exit 1
          else
            echo "${BRANCH} already gone"
          fi
